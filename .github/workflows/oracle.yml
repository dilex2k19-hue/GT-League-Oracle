name: GT League Oracle Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # This tells GitHub to run every 30 minutes!
  workflow_dispatch:        # This adds a button so you can run it manually to test!

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' 

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pandas scikit-learn joblib

      - name: Run The Oracle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 
        run: |
          python harvester.py
          python telegram_bot.py